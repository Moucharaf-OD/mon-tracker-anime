<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Otaku Log</h1>
        <p>Mes animés et webtoons, suivis au fil du temps</p>
        <button id="bouton-theme">&#127769; Mode sombre</button>
    </header>

    <main>
        <section id="section-animes">
            <h2>Animés</h2>
            <div class="grille-cartes">
                 
                <article class="carte">
                    <img src="https://via.placeholder.com/150x220" alt="Affiche de l'animé">
                   <h3>Nom de l'animé</h3>
                   <p class="synopsis">Description de l'animé.</p>
                   <p class="note">&#11088; 8/10</p>
                </article>

            </div>
        </section>

        <section id="section-webtoons">
            <h2>Webtoons</h2>
            <div class="grille-cartes">

                <article class="carte">
                    <img src="https://via.placeholder.com/150x220" alt="Affiche du webtoon">
                    <h3>Nom du webtoon</h3>
                    <p class="synopsis">Description du webtoon.</p>
                    <p class="note">&#11088; 9/10</p>
                </article>
                
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Otaku Log</h1>
        <p>Mes animés et webtoons, suivis au fil du temps</p>
        <button id="bouton-theme">&#127769; Mode sombre</button>
    </header>

    

    <main>
        <section id="section-animes">
            <h2>Animés</h2>
            <div class="grille-cartes">
            </div>
        </section>

        <section id="section-webtoons">
            <h2>Webtoons</h2>
            <div class="grille-cartes">
            </div>
        </section>

    </main>

    <form id="formulaire-ajout">
        <input type="text" id="input-titre" placeholder="Titre" required>
        <textarea id="input-synopsis" placeholder="Synopsis"></textarea>
        <input type="number" id="input-note" placeholder="Note /10" min="0" max="10" required>

        <select id="input-type">
            <option value="anime">Animé</option>
            <option value="webtoon">Webtoon</option>
        </select>

        <button type="submit">Ajouter</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
